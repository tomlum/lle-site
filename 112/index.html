  <script>
    function toggleImage(el) {
      imgDisplay = document.querySelector(`#${el.id} ~ img`).style.display
      if(imgDisplay == "inline"){
        document.querySelector(`#${el.id} ~ img`).style.display = "none"
      } else{
        document.querySelector(`#${el.id} ~ img`).style.display = "inline"
      }
    }
